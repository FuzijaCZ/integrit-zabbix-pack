              expression: 'min(/INT MON-AD Domain controller/int.ad.repl.failures["{#KEY}"],{$INT.AD.REPL.FAIL.PERIOD})>=1 or last(/INT MON-AD Domain controller/int.ad.repl.age["{#KEY}"])>{$INT.AD.REPL.MAXAGE}'
              name: 'INT: AD replication from {#PARTNER} failing ({#NC})'
              opdata: 'Failures: {ITEM.LASTVALUE1}, last success {ITEM.LASTVALUE2} ago'
              priority: HIGH
              description: 'Run repadmin /showrepl and repadmin /replsummary on the DC. Long outages lead to lingering objects (tombstone lifetime).'
