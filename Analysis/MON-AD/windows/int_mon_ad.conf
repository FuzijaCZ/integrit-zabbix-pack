# Integrit MON-AD UserParameters for Zabbix agent 2 on domain controllers.
# Copy to: C:\Program Files\Zabbix Agent 2\zabbix_agent2.d\int_mon_ad.conf
# Script:  C:\Program Files\Zabbix Agent 2\scripts\int_mon_ad.ps1
# Timeouts come from the item settings in template "INT MON-AD Domain controller".

UserParameter=int.ad.repl,powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\Program Files\Zabbix Agent 2\scripts\int_mon_ad.ps1" -Mode repl
UserParameter=int.ad.sysvol,powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\Program Files\Zabbix Agent 2\scripts\int_mon_ad.ps1" -Mode sysvol
UserParameter=int.ad.time,powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\Program Files\Zabbix Agent 2\scripts\int_mon_ad.ps1" -Mode time
UserParameter=int.ad.backup,powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\Program Files\Zabbix Agent 2\scripts\int_mon_ad.ps1" -Mode backup
UserParameter=int.ad.dcdiag,powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\Program Files\Zabbix Agent 2\scripts\int_mon_ad.ps1" -Mode dcdiag
UserParameter=int.ad.pdc,powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\Program Files\Zabbix Agent 2\scripts\int_mon_ad.ps1" -Mode pdc
UserParameter=int.ad.accounts[*],powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\Program Files\Zabbix Agent 2\scripts\int_mon_ad.ps1" -Mode accounts -Days $1 -SvcGroup "$2"
