                }
                var f = entry.replace(/\\\|/g, '\u0001').split('|').map(function (x) { return x.replace(/\u0001/g, '|'); }), row = {};
                if (f.length !== names.length) {
                    throw 'Entry "' + entry + '" needs ' + names.length + ' fields separated by |: ' + p.fields;
                }
                names.forEach(function (n, i) { row[n.trim()] = f[i].trim(); });
                out.push(row);
            });
            return JSON.stringify(out);
          parameters:
            - name: fields
              value: '{#LABEL},{#HOST},{#PORT}'
            - name: list
              value: '{$INT.CUSTOM.PORTS}'
          enabled_lifetime_type: DISABLE_NEVER
          description: 'One check per entry of {$INT.CUSTOM.PORTS} (entries separated by ;, fields by |).'
          item_prototypes:
            - uuid: b4114d845d2647278e51fda32d7dd7f0
              name: 'TCP {#LABEL}: Port {#PORT} on {#HOST}'
              type: SIMPLE
              key: 'net.tcp.service[tcp,{#HOST},{#PORT}]'
              delay: 1m
              tags:
                - tag: component
                  value: tcp
                - tag: check
                  value: '{#LABEL}'
              trigger_prototypes:
                - uuid: 5e57936f5a344b29a40751c5dd00cbd5
                  expression: 'max(/INT MON-CUSTOM TCP/net.tcp.service[tcp,{#HOST},{#PORT}],#3)=0'
                  name: 'INT: TCP check {#LABEL}: {#HOST}:{#PORT} not reachable'
                  priority: HIGH
                  tags:
                    - tag: scope
                      value: availability
      tags:
        - tag: service
          value: MON-CUSTOM
        - tag: version
          value: '1.0'
      macros:
        - macro: '{$INT.CUSTOM.PORTS}'
          description: 'label|host|port;...'
