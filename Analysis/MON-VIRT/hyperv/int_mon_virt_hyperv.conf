# Integrit MON-VIRT UserParameters for Zabbix agent 2 on Hyper-V hosts.
# Copy to: C:\Program Files\Zabbix Agent 2\zabbix_agent2.d\int_mon_virt_hyperv.conf
# Script:  C:\Program Files\Zabbix Agent 2\scripts\int_mon_virt_hyperv.ps1
# Timeouts come from the item settings in template "INT MON-VIRT Hyper-V".

UserParameter=int.hv.vms,powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\Program Files\Zabbix Agent 2\scripts\int_mon_virt_hyperv.ps1" -Mode vms
UserParameter=int.hv.cluster,powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\Program Files\Zabbix Agent 2\scripts\int_mon_virt_hyperv.ps1" -Mode cluster
