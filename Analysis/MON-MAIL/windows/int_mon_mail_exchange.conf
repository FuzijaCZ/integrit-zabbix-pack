# Integrit MON-MAIL UserParameters for Zabbix agent 2 on Exchange servers.
# Copy to: C:\Program Files\Zabbix Agent 2\zabbix_agent2.d\int_mon_mail_exchange.conf
# Script:  C:\Program Files\Zabbix Agent 2\scripts\int_mon_mail_exchange.ps1
# Timeouts come from the item settings in template "INT MON-MAIL Exchange".

UserParameter=int.exch.db,powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\Program Files\Zabbix Agent 2\scripts\int_mon_mail_exchange.ps1" -Mode db
UserParameter=int.exch.cert,powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\Program Files\Zabbix Agent 2\scripts\int_mon_mail_exchange.ps1" -Mode cert
