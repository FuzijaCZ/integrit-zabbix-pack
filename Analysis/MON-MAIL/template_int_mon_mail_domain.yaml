          description: 'Application (client) ID of the multi-tenant app "Integrit Mail Probe" (global macro).'
        - macro: '{$INT.MAIL.E2E.CUSTOMER.MAILBOX}'
          description: 'Customer test mailbox (shared mailbox, no licence), e.g. zabbix-probe@acme.cz.'
        - macro: '{$INT.MAIL.E2E.CUSTOMER.TENANT}'
          description: 'Customer tenant ID or primary domain (acme.onmicrosoft.com).'
        - macro: '{$INT.MAIL.E2E.INTERVAL}'
          value: 15m
        - macro: '{$INT.MAIL.E2E.LATENCY.WARN}'
          value: '600'
          description: 'Seconds. Draft: slow delivery > 10 min = WARNING.'
        - macro: '{$INT.MAIL.E2E.LOOKBACK}'
          value: '120'
          description: 'Minutes searched back for probes in the mailboxes.'
        - macro: '{$INT.MAIL.E2E.PROBE.MAILBOX}'
          description: 'Integrit probe mailbox in the Integrit tenant (global macro).'
        - macro: '{$INT.MAIL.E2E.PROBE.TENANT}'
          description: 'Integrit tenant ID (global macro).'
        - macro: '{$INT.MAIL.E2E.SECRET}'
