    - uuid: 8456e14c198941f8b4dc6536f1262e2a
      template: 'INT MON-ROLE IIS'
      name: 'INT MON-ROLE IIS'
      description: |
        Integrit MON-ROLE IIS pack (agent 2 active): application pools running, request queues, W3SVC / WAS services.
        The official 'IIS by Zabbix agent active' is not linked: its agent availability item collides with 'Windows by Zabbix agent active'.
      vendor:
        name: 'integrit s.r.o.'
        version: 7.0-1
      groups:
        - name: Templates/Integrit/MON-ROLE
      discovery_rules:
        - uuid: 49bf4408486d4c9f846e99b08895e709
          name: 'Application pools discovery'
          type: ZABBIX_ACTIVE
          key: 'wmi.getall[root\webAdministration, select Name from ApplicationPool]'
          delay: 1h
          filter:
            evaltype: AND
            conditions:
              - macro: '{#APPPOOL}'
                value: '{$INT.ROLE.IIS.APPPOOL.MATCHES}'
                formulaid: A
              - macro: '{#APPPOOL}'
                value: '{$INT.ROLE.IIS.APPPOOL.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
          lifetime: 7d
          enabled_lifetime_type: DISABLE_NEVER
          item_prototypes:
            - uuid: b9d1a18d3c6542c9bb2144a8fa3dec94
              name: 'AppPool {#APPPOOL}: state'
              type: ZABBIX_ACTIVE
              key: 'perf_counter_en["\APP_POOL_WAS({#APPPOOL})\Current Application Pool State"]'
              delay: 1m
              description: '3 = Running.'
              valuemap:
                name: 'INT ROLE app pool state'
              tags:
                - tag: component
                  value: iis
            - uuid: 0c7da734625747b7b5b007ae61d674d2
              name: 'AppPool {#APPPOOL}: request queue'
              type: ZABBIX_ACTIVE
              key: 'perf_counter_en["\HTTP Service Request Queues({#APPPOOL})\CurrentQueueSize"]'
              delay: 1m
              tags:
                - tag: component
                  value: iis
          trigger_prototypes:
            - uuid: 930d6abb243f453caee116e0755474d2
              expression: 'min(/INT MON-ROLE IIS/perf_counter_en["\APP_POOL_WAS({#APPPOOL})\Current Application Pool State"],#3)<>3'
              name: 'INT: IIS application pool {#APPPOOL} on {HOST.NAME} is not running'
              opdata: '{ITEM.LASTVALUE1}'
              priority: HIGH
              description: 'The web application is down (crash, rapid-fail protection, identity password changed). Check the System / WAS event log.'
              tags:
                - tag: scope
                  value: availability
            - uuid: a8b47d1a15d14dec8a72bbcb21317584
              expression: 'min(/INT MON-ROLE IIS/perf_counter_en["\HTTP Service Request Queues({#APPPOOL})\CurrentQueueSize"],{$INT.ROLE.IIS.QUEUE.TIME})>{$INT.ROLE.IIS.QUEUE.MAX}'
              name: 'INT: IIS request queue of {#APPPOOL} on {HOST.NAME} is too long'
              priority: WARNING
              description: 'Requests wait for the application (slow backend / DB, too few workers).'
              tags:
                - tag: scope
                  value: performance
          lld_macro_paths:
            - lld_macro: '{#APPPOOL}'
              path: $.Name
        - uuid: 0e022a14b1694fb3bdf6547c0a495bd6
          name: 'IIS services from {$INT.ROLE.IIS.SERVICES}'
          type: SCRIPT
          key: 'int.role.services[iis]'
          delay: 1h
          params: |
            var p = JSON.parse(value), names = String(p.fields).split(','), out = [];
            String(p.list).split(';').forEach(function (entry) {
                if (!entry.trim()) {
                    return;
                }
                var f = entry.replace(/\\\|/g, '\u0001').split('|').map(function (x) { return x.replace(/\u0001/g, '|'); }), row = {};
                if (f.length !== names.length) {
                    throw 'Entry "' + entry + '" needs ' + names.length + ' fields separated by |: ' + p.fields;
                }
                names.forEach(function (n, i) { row[n.trim()] = f[i].trim(); });
                out.push(row);
            });
            return JSON.stringify(out);
          parameters:
            - name: fields
              value: '{#SERVICE}'
            - name: list
              value: '{$INT.ROLE.IIS.SERVICES}'
          enabled_lifetime_type: DISABLE_NEVER
          description: 'Service (short) names separated by ;. Exclude them from the MON-SRV official service discovery ({$SERVICE.NAME.NOT_MATCHES}).'
          item_prototypes:
            - uuid: f84aa87629e0463195fdcbd068f5b19e
              name: 'Service {#SERVICE}: state'
              type: ZABBIX_ACTIVE
              key: 'service.info[{#SERVICE}]'
              delay: 1m
              valuemap:
                name: 'INT ROLE service state'
              tags:
                - tag: component
                  value: service
          trigger_prototypes:
            - uuid: cfbdfb6c78b34fb9a7bb645cad075b38
              expression: 'min(/INT MON-ROLE IIS/service.info[{#SERVICE}],#3)<>0'
              name: 'INT: IIS service {#SERVICE} is not running on {HOST.NAME}'
              opdata: '{ITEM.LASTVALUE1}'
              priority: HIGH
              description: 'The role is down for its users. Check the event log of the service.'
              tags:
                - tag: scope
                  value: availability
      tags:
        - tag: service
          value: MON-ROLE
        - tag: version
          value: '1.0'
      macros:
        - macro: '{$INT.ROLE.IIS.APPPOOL.MATCHES}'
          value: '.+'
        - macro: '{$INT.ROLE.IIS.APPPOOL.NOT_MATCHES}'
          value: 'CHANGE_IF_NEEDED'
          description: 'Pools that are stopped on purpose.'
        - macro: '{$INT.ROLE.IIS.QUEUE.MAX}'
          value: '100'
        - macro: '{$INT.ROLE.IIS.QUEUE.TIME}'
          value: '5m'
        - macro: '{$INT.ROLE.IIS.SERVICES}'
          value: 'W3SVC;WAS'
      valuemaps:
        - uuid: cbc33637c1f14a9591e25ab8a85aba57
          name: 'INT ROLE service state'
          mappings:
            - value: '0'
              newvalue: Running
            - value: '1'
              newvalue: Paused
            - value: '2'
              newvalue: 'Start pending'
            - value: '3'
              newvalue: 'Pause pending'
            - value: '4'
              newvalue: 'Continue pending'
            - value: '5'
              newvalue: 'Stop pending'
            - value: '6'
              newvalue: Stopped
            - value: '7'
              newvalue: Unknown
            - value: '255'
              newvalue: 'No such service'
        - uuid: 215a1b9def6d49baa0c5d65e3f13ecb3
          name: 'INT ROLE app pool state'
          mappings:
            - value: '1'
              newvalue: Uninitialized
            - value: '2'
              newvalue: Initialized
            - value: '3'
              newvalue: Running
            - value: '4'
              newvalue: Disabling
            - value: '5'
              newvalue: Disabled
            - value: '6'
              newvalue: 'Shutdown pending'
            - value: '7'
              newvalue: 'Delete pending'
