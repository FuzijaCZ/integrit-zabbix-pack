zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: b6227329c19445cd944924c363dd68e4
      name: Templates/Integrit/MON-ROLE
  templates:
    - uuid: 1215fb251085482caf31c3e0984d3436
      template: 'INT MON-ROLE File server'
      name: 'INT MON-ROLE File server'
      description: |
        Integrit MON-ROLE file server pack (agent 2 active, next to INT MON-SRV Windows): shares online, shadow copies
        (age and sudden drop = ransomware indicator), FSRM quotas, inbound DFS-R backlog, LanmanServer / DFSR services.
      vendor:
        name: 'integrit s.r.o.'
        version: 7.0-1
      groups:
        - name: Templates/Integrit/MON-ROLE
      items:
        - uuid: 4012669053a249eea14413cb51d9c4c2
          name: 'File server: shares raw'
          type: ZABBIX_ACTIVE
          key: 'int.role.shares'
          delay: '5m'
          history: '0'
          value_type: TEXT
          trends: '0'
          timeout: 60s
          tags:
            - tag: component
              value: raw
        - uuid: b19041bd47a44149a9368de7236d3e7d
          name: 'File server: shadow copies raw'
          type: ZABBIX_ACTIVE
          key: 'int.role.vss'
          delay: '30m'
          history: '0'
          value_type: TEXT
          trends: '0'
          timeout: 60s
          tags:
            - tag: component
              value: raw
        - uuid: 6e958604f8da48caafd9ba6670416242
          name: 'File server: FSRM quotas raw'
          type: ZABBIX_ACTIVE
          key: 'int.role.fsrm'
          delay: '15m'
          history: '0'
          value_type: TEXT
          trends: '0'
          timeout: 60s
          tags:
            - tag: component
              value: raw
        - uuid: 045559d733e84073933f5badcdd7973a
          name: 'File server: DFS-R backlog raw'
          type: ZABBIX_ACTIVE
          key: 'int.role.dfsr'
          delay: '{$INT.ROLE.DFSR.INTERVAL}'
          history: '0'
          value_type: TEXT
          trends: '0'
          timeout: 300s
          tags:
            - tag: component
              value: raw
      discovery_rules:
        - uuid: 70686370baf74d73a380d88444821488
          name: 'Shares discovery'
          type: DEPENDENT
          key: int.role.shares.discovery
          delay: '0'
          filter:
            conditions:
              - macro: '{#SHARE}'
                value: '{$INT.ROLE.SHARE.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: A
          lifetime: 7d
          enabled_lifetime_type: DISABLE_NEVER
          item_prototypes:
            - uuid: 627246f5a1e84c25a18296897e08d939
              name: 'Share {#SHARE}: online'
              type: DEPENDENT
              key: 'int.role.share.ok[{#SHARE}]'
              delay: '0'
              description: '1 = shared and the folder {#PATH} exists.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.share==''{#SHARE}'')].ok.first()'
                  error_handler: DISCARD_VALUE
              valuemap:
                name: 'INT ROLE FILE yes/no'
              master_item:
                key: 'int.role.shares'
              tags:
                - tag: component
                  value: share
          trigger_prototypes:
            - uuid: 80f0590de8024166ac906d03a07dc6b4
              expression: 'max(/INT MON-ROLE File server/int.role.share.ok[{#SHARE}],#2)=0'
              name: 'INT: Share {#SHARE} on {HOST.NAME} is offline'
              priority: HIGH
              description: 'Folder {#PATH} missing (disk offline, renamed, failed volume). Users lose access.'
              tags:
                - tag: scope
                  value: availability
            - uuid: 0d82fa16963d4ccc87b1a69b3c23fed9
              expression: 'nodata(/INT MON-ROLE File server/int.role.share.ok[{#SHARE}],{$INT.ROLE.SHARE.GONE})=1'
              name: 'INT: Share {#SHARE} on {HOST.NAME} no longer exists'
              priority: AVERAGE
              description: 'The share was removed or renamed (if intended, the item is deleted after 7 days).'
              tags:
                - tag: scope
                  value: availability
          master_item:
            key: 'int.role.shares'
          lld_macro_paths:
            - lld_macro: '{#SHARE}'
              path: $.share
            - lld_macro: '{#PATH}'
              path: $.path
        - uuid: f190c189a53442f890993a404a85765a
          name: 'Shadow copy volumes discovery'
          type: DEPENDENT
          key: int.role.vss.discovery
          delay: '0'
          filter:
            conditions:
              - macro: '{#COUNT}'
                value: '^[1-9]'
                formulaid: A
          lifetime: 7d
          enabled_lifetime_type: DISABLE_NEVER
          item_prototypes:
            - uuid: 87882aa5d97649a0b28b202b8df1b3d8
              name: 'Volume {#VOLUME}: newest shadow copy age'
              type: DEPENDENT
              key: 'int.role.vss.age[{#VOLUME}]'
              delay: '0'
              value_type: FLOAT
              units: 'h'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.volume==''{#VOLUME}'')].age_h.first()'
                  error_handler: DISCARD_VALUE
              master_item:
                key: 'int.role.vss'
              tags:
                - tag: component
                  value: vss
            - uuid: b82f55eda1ee4821ad0244b42cccb563
              name: 'Volume {#VOLUME}: shadow copies'
              type: DEPENDENT
              key: 'int.role.vss.count[{#VOLUME}]'
              delay: '0'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.volume==''{#VOLUME}'')].count.first()'
                  error_handler: DISCARD_VALUE
              master_item:
                key: 'int.role.vss'
              tags:
                - tag: component
                  value: vss
          trigger_prototypes:
            - uuid: 14eb8886b5c549688893c2582df1c3f7
              expression: 'last(/INT MON-ROLE File server/int.role.vss.count[{#VOLUME}])<{$INT.ROLE.VSS.DROP.PCT}/100*max(/INT MON-ROLE File server/int.role.vss.count[{#VOLUME}],1d) and max(/INT MON-ROLE File server/int.role.vss.count[{#VOLUME}],1d)>=2'
              name: 'INT: Shadow copies on {HOST.NAME} {#VOLUME} dropped from {ITEM.LASTVALUE2} to {ITEM.LASTVALUE1}'
              priority: HIGH
              description: 'More than half of the snapshots disappeared at once: typical ransomware step (vssadmin delete shadows). Check the server now. Planned change (storage limit lowered): close the problem.'
              tags:
                - tag: scope
                  value: security
            - uuid: c881e812105d49dcad4d92ef93efc884
              expression: 'last(/INT MON-ROLE File server/int.role.vss.age[{#VOLUME}])>{$INT.ROLE.VSS.AGE.MAX} or last(/INT MON-ROLE File server/int.role.vss.age[{#VOLUME}])=-1'
              name: 'INT: Newest shadow copy on {HOST.NAME} {#VOLUME} is older than {$INT.ROLE.VSS.AGE.MAX} h'
              priority: AVERAGE
              description: 'Previous Versions for users are not being created (scheduled task, storage area full).'
              tags:
                - tag: scope
                  value: availability
          master_item:
            key: 'int.role.vss'
          lld_macro_paths:
            - lld_macro: '{#VOLUME}'
              path: $.volume
            - lld_macro: '{#COUNT}'
              path: $.count
        - uuid: 004ec964a39942bdb27e0d83f0ead1a8
          name: 'FSRM quotas discovery'
          type: DEPENDENT
          key: int.role.fsrm.discovery
          delay: '0'
          lifetime: 7d
          enabled_lifetime_type: DISABLE_NEVER
          item_prototypes:
            - uuid: 37ed81909a994d44aa664189078cd75e
              name: 'Quota {#PATH}: used'
              type: DEPENDENT
              key: 'int.role.fsrm.pct[{#PATH}]'
              delay: '0'
              value_type: FLOAT
              units: '%'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.path==''{#PATH}'')].pct.first()'
                  error_handler: DISCARD_VALUE
              master_item:
                key: 'int.role.fsrm'
              tags:
                - tag: component
                  value: quota
          trigger_prototypes:
            - uuid: d392f2bf004c44529bf64b0f581d4a02
              expression: 'last(/INT MON-ROLE File server/int.role.fsrm.pct[{#PATH}])>{$INT.ROLE.FSRM.CRIT}'
              name: 'INT: Quota {#PATH} on {HOST.NAME} is {ITEM.LASTVALUE1} full'
              priority: AVERAGE
              description: 'Users will get "disk full" in this folder. Raise the quota or clean up.'
              tags:
                - tag: scope
                  value: capacity
            - uuid: 1910c50a786e4aa8b2548478e1fca9bc
              expression: 'last(/INT MON-ROLE File server/int.role.fsrm.pct[{#PATH}])>{$INT.ROLE.FSRM.WARN}'
              name: 'INT: Quota {#PATH} on {HOST.NAME} is {ITEM.LASTVALUE1} full (> {$INT.ROLE.FSRM.WARN} %)'
              priority: WARNING
              dependencies:
                - name: 'INT: Quota {#PATH} on {HOST.NAME} is {ITEM.LASTVALUE1} full'
                  expression: 'last(/INT MON-ROLE File server/int.role.fsrm.pct[{#PATH}])>{$INT.ROLE.FSRM.CRIT}'
              tags:
                - tag: scope
                  value: capacity
          master_item:
            key: 'int.role.fsrm'
          lld_macro_paths:
            - lld_macro: '{#PATH}'
              path: $.path
        - uuid: 5c1dcdc720304f348fbe32287c899c96
          name: 'DFS-R inbound connections discovery'
          type: DEPENDENT
          key: int.role.dfsr.discovery
          delay: '0'
          lifetime: 7d
          enabled_lifetime_type: DISABLE_NEVER
          item_prototypes:
            - uuid: c09a206bd8254d8b9570310932800aad
              name: 'DFS-R {#FOLDER} from {#PARTNER}: backlog'
              type: DEPENDENT
              key: 'int.role.dfsr.backlog[{#FOLDER},{#PARTNER}]'
              delay: '0'
              description: 'Files waiting to replicate to this server. -1 = backlog query failed.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.folder==''{#FOLDER}'' && @.partner==''{#PARTNER}'')].backlog.first()'
                  error_handler: DISCARD_VALUE
              master_item:
                key: 'int.role.dfsr'
              tags:
                - tag: component
                  value: dfsr
          trigger_prototypes:
            - uuid: cabc920629474af5ba40bda2433e683e
              expression: 'min(/INT MON-ROLE File server/int.role.dfsr.backlog[{#FOLDER},{#PARTNER}],{$INT.ROLE.DFSR.TIME})>{$INT.ROLE.DFSR.MAX}'
              name: 'INT: DFS-R backlog {#FOLDER} from {#PARTNER} on {HOST.NAME}: {ITEM.LASTVALUE1} files'
              priority: AVERAGE
              description: 'Replication is not keeping up or stuck (sharing violations, staging quota, network). Users at the sites see different files.'
              tags:
                - tag: scope
                  value: availability
            - uuid: af568d6c68c24f2287047610623d73b7
              expression: 'min(/INT MON-ROLE File server/int.role.dfsr.backlog[{#FOLDER},{#PARTNER}],{$INT.ROLE.DFSR.TIME})=-1'
              name: 'INT: DFS-R backlog of {#FOLDER} from {#PARTNER} cannot be read'
              priority: WARNING
              description: 'Get-DfsrBacklog fails (partner unreachable, WMI). Check dfsdiag / the DFS Replication event log.'
              tags:
                - tag: scope
                  value: monitoring
          master_item:
            key: 'int.role.dfsr'
          lld_macro_paths:
            - lld_macro: '{#FOLDER}'
              path: $.folder
            - lld_macro: '{#PARTNER}'
              path: $.partner
        - uuid: e833e8bcdcee49debfd6063bc3be012d
          name: 'File server services from {$INT.ROLE.FILE.SERVICES}'
          type: SCRIPT
          key: 'int.role.services[file_server]'
          delay: 1h
          params: |
            var p = JSON.parse(value), names = String(p.fields).split(','), out = [];
            String(p.list).split(';').forEach(function (entry) {
                if (!entry.trim()) {
                    return;
                }
                var f = entry.replace(/\\\|/g, '\u0001').split('|').map(function (x) { return x.replace(/\u0001/g, '|'); }), row = {};
                if (f.length !== names.length) {
                    throw 'Entry "' + entry + '" needs ' + names.length + ' fields separated by |: ' + p.fields;
                }
                names.forEach(function (n, i) { row[n.trim()] = f[i].trim(); });
                out.push(row);
            });
            return JSON.stringify(out);
          parameters:
            - name: fields
              value: '{#SERVICE}'
            - name: list
              value: '{$INT.ROLE.FILE.SERVICES}'
          enabled_lifetime_type: DISABLE_NEVER
          description: 'Service (short) names separated by ;. Exclude them from the MON-SRV official service discovery ({$SERVICE.NAME.NOT_MATCHES}).'
          item_prototypes:
            - uuid: 431a2ca72500434db0fb0f32ecd17fe3
              name: 'Service {#SERVICE}: state'
              type: ZABBIX_ACTIVE
              key: 'service.info[{#SERVICE}]'
              delay: 1m
              valuemap:
                name: 'INT ROLE FILE service state'
              tags:
                - tag: component
                  value: service
          trigger_prototypes:
            - uuid: 2bc7245b39984e3cb4c82dc537bc22a5
              expression: 'min(/INT MON-ROLE File server/service.info[{#SERVICE}],#3)<>0'
              name: 'INT: File server service {#SERVICE} is not running on {HOST.NAME}'
              opdata: '{ITEM.LASTVALUE1}'
              priority: HIGH
              description: 'The role is down for its users. Check the event log of the service.'
              tags:
                - tag: scope
                  value: availability
      tags:
        - tag: service
          value: MON-ROLE
        - tag: version
          value: '1.0'
      macros:
        - macro: '{$INT.ROLE.DFSR.INTERVAL}'
          value: '30m'
          description: 'DFS-R backlog collection interval (slow query).'
        - macro: '{$INT.ROLE.DFSR.MAX}'
          value: '1000'
        - macro: '{$INT.ROLE.DFSR.TIME}'
          value: '1h'
        - macro: '{$INT.ROLE.FILE.SERVICES}'
          value: 'LanmanServer'
          description: 'Add DFSR on DFS-R members, e.g. LanmanServer;DFSR.'
        - macro: '{$INT.ROLE.FSRM.CRIT}'
          value: '95'
        - macro: '{$INT.ROLE.FSRM.WARN}'
          value: '85'
        - macro: '{$INT.ROLE.SHARE.GONE}'
          value: '1h'
        - macro: '{$INT.ROLE.SHARE.NOT_MATCHES}'
          value: '^(print\$|prnproxy|NETLOGON|SYSVOL)$'
          description: 'Shares not monitored (DC shares are in MON-AD).'
        - macro: '{$INT.ROLE.VSS.AGE.MAX}'
          value: '26'
          description: 'Hours.'
        - macro: '{$INT.ROLE.VSS.DROP.PCT}'
          value: '50'
          description: 'HIGH when the count falls below this % of the 1-day maximum.'
      valuemaps:
        - uuid: 24647004d5314fcf9aae1a8322fc5ee8
          name: 'INT ROLE FILE service state'
          mappings:
            - value: '0'
              newvalue: Running
            - value: '1'
              newvalue: Paused
            - value: '2'
              newvalue: 'Start pending'
            - value: '3'
              newvalue: 'Pause pending'
            - value: '4'
              newvalue: 'Continue pending'
            - value: '5'
              newvalue: 'Stop pending'
            - value: '6'
              newvalue: Stopped
            - value: '7'
              newvalue: Unknown
            - value: '255'
              newvalue: 'No such service'
        - uuid: e27f6db875c5468885b35ef364cf0785
          name: 'INT ROLE FILE yes/no'
          mappings:
            - value: '0'
              newvalue: 'no'
            - value: '1'
              newvalue: 'yes'
    - uuid: 9d4672698c514b9696fa8e604fad9cbc
      template: 'INT MON-ROLE DHCP server'
      name: 'INT MON-ROLE DHCP server'
      description: |
        Integrit MON-ROLE DHCP server pack (Windows, agent 2 active): scope utilisation, failover state, DHCPServer service.
      vendor:
        name: 'integrit s.r.o.'
        version: 7.0-1
      groups:
        - name: Templates/Integrit/MON-ROLE
      items:
        - uuid: 3a052ba699604729acbf719434730719
          name: 'DHCP: raw'
          type: ZABBIX_ACTIVE
          key: 'int.role.dhcp'
          delay: '5m'
          history: '0'
          value_type: TEXT
          trends: '0'
          timeout: 60s
          tags:
            - tag: component
              value: raw
      discovery_rules:
        - uuid: 35ea084359d440d0b3506c9b4b8d3a87
          name: 'DHCP scopes discovery'
          type: DEPENDENT
          key: int.role.dhcp.scopes.discovery
          delay: '0'
          filter:
            conditions:
              - macro: '{#SCOPE}'
                value: '{$INT.ROLE.DHCP.SCOPE.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: A
          lifetime: 7d
          enabled_lifetime_type: DISABLE_NEVER
          item_prototypes:
            - uuid: 62ae168d58dd403ea06c2ca435998e0d
              name: 'Scope {#SCOPE} ({#NAME}): used'
              type: DEPENDENT
              key: 'int.role.dhcp.pct[{#SCOPE}]'
              delay: '0'
              value_type: FLOAT
              units: '%'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.scopes[?(@.scope==''{#SCOPE}'')].pct.first()'
                  error_handler: DISCARD_VALUE
              master_item:
                key: 'int.role.dhcp'
              tags:
                - tag: component
                  value: dhcp
            - uuid: 06a0bafe96e44e5cb3f345eeb984ac97
              name: 'Scope {#SCOPE} ({#NAME}): free addresses'
              type: DEPENDENT
              key: 'int.role.dhcp.free[{#SCOPE}]'
              delay: '0'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.scopes[?(@.scope==''{#SCOPE}'')].free.first()'
                  error_handler: DISCARD_VALUE
              master_item:
                key: 'int.role.dhcp'
              tags:
                - tag: component
                  value: dhcp
          trigger_prototypes:
            - uuid: 974818425d774ebc946912a442a1bd00
              expression: 'min(/INT MON-ROLE DHCP server/int.role.dhcp.pct[{#SCOPE}],10m)>{$INT.ROLE.DHCP.CRIT}'
              name: 'INT: DHCP scope {#SCOPE} ({#NAME}) on {HOST.NAME} is {ITEM.LASTVALUE1} used'
              priority: HIGH
              description: 'New devices will not get an address. Shorten the lease or extend the scope.'
              tags:
                - tag: scope
                  value: capacity
            - uuid: bf91440cfaec4cd0adec9b3b98bc9d7f
              expression: 'min(/INT MON-ROLE DHCP server/int.role.dhcp.pct[{#SCOPE}],10m)>{$INT.ROLE.DHCP.WARN}'
              name: 'INT: DHCP scope {#SCOPE} ({#NAME}) on {HOST.NAME} is over {$INT.ROLE.DHCP.WARN} % used'
              priority: AVERAGE
              dependencies:
                - name: 'INT: DHCP scope {#SCOPE} ({#NAME}) on {HOST.NAME} is {ITEM.LASTVALUE1} used'
                  expression: 'min(/INT MON-ROLE DHCP server/int.role.dhcp.pct[{#SCOPE}],10m)>{$INT.ROLE.DHCP.CRIT}'
              tags:
                - tag: scope
                  value: capacity
          master_item:
            key: 'int.role.dhcp'
          lld_macro_paths:
            - lld_macro: '{#SCOPE}'
              path: $.scope
            - lld_macro: '{#NAME}'
              path: $.name
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.scopes
        - uuid: 9ba4070dc57842a39316adef58ac4d3c
          name: 'DHCP failover discovery'
          type: DEPENDENT
          key: int.role.dhcp.failover.discovery
          delay: '0'
          lifetime: 7d
          enabled_lifetime_type: DISABLE_NEVER
          item_prototypes:
            - uuid: e96417c81b06447484ecad38a849a5a1
              name: 'Failover {#FAILOVER}: state'
              type: DEPENDENT
              key: 'int.role.dhcp.failover[{#FAILOVER}]'
              delay: '0'
              value_type: CHAR
              trends: '0'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.failover[?(@.name==''{#FAILOVER}'')].state.first()'
                  error_handler: DISCARD_VALUE
              master_item:
                key: 'int.role.dhcp'
              tags:
                - tag: component
                  value: dhcp
          trigger_prototypes:
            - uuid: 6b6af709e2e848e3b169fa1c6041f05a
              expression: 'last(/INT MON-ROLE DHCP server/int.role.dhcp.failover[{#FAILOVER}])<>"Normal" and last(/INT MON-ROLE DHCP server/int.role.dhcp.failover[{#FAILOVER}],#2)<>"Normal"'
              name: 'INT: DHCP failover {#FAILOVER} on {HOST.NAME} is {ITEM.LASTVALUE1}'
              priority: HIGH
              description: 'Partner down / communication interrupted: no redundancy, leases may conflict after recovery.'
              tags:
                - tag: scope
                  value: availability
          master_item:
            key: 'int.role.dhcp'
          lld_macro_paths:
            - lld_macro: '{#FAILOVER}'
              path: $.name
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.failover
        - uuid: 5e70ae007b4f44e4bb90006d6b358845
          name: 'DHCP services from {$INT.ROLE.DHCP.SERVICES}'
          type: SCRIPT
          key: 'int.role.services[dhcp]'
          delay: 1h
          params: |
            var p = JSON.parse(value), names = String(p.fields).split(','), out = [];
            String(p.list).split(';').forEach(function (entry) {
                if (!entry.trim()) {
                    return;
                }
                var f = entry.replace(/\\\|/g, '\u0001').split('|').map(function (x) { return x.replace(/\u0001/g, '|'); }), row = {};
                if (f.length !== names.length) {
                    throw 'Entry "' + entry + '" needs ' + names.length + ' fields separated by |: ' + p.fields;
                }
                names.forEach(function (n, i) { row[n.trim()] = f[i].trim(); });
                out.push(row);
            });
            return JSON.stringify(out);
          parameters:
            - name: fields
              value: '{#SERVICE}'
            - name: list
              value: '{$INT.ROLE.DHCP.SERVICES}'
          enabled_lifetime_type: DISABLE_NEVER
          description: 'Service (short) names separated by ;. Exclude them from the MON-SRV official service discovery ({$SERVICE.NAME.NOT_MATCHES}).'
          item_prototypes:
            - uuid: 27feb1cd9d3d4ec2aabc991901ad2aae
              name: 'Service {#SERVICE}: state'
              type: ZABBIX_ACTIVE
              key: 'service.info[{#SERVICE}]'
              delay: 1m
              valuemap:
                name: 'INT ROLE DHCP service state'
              tags:
                - tag: component
                  value: service
          trigger_prototypes:
            - uuid: 69f26c2e606d4ce0b14326b4ff6615ce
              expression: 'min(/INT MON-ROLE DHCP server/service.info[{#SERVICE}],#3)<>0'
              name: 'INT: DHCP service {#SERVICE} is not running on {HOST.NAME}'
              opdata: '{ITEM.LASTVALUE1}'
              priority: HIGH
              description: 'The role is down for its users. Check the event log of the service.'
              tags:
                - tag: scope
                  value: availability
      tags:
        - tag: service
          value: MON-ROLE
        - tag: version
          value: '1.0'
      macros:
        - macro: '{$INT.ROLE.DHCP.CRIT}'
          value: '95'
        - macro: '{$INT.ROLE.DHCP.SCOPE.NOT_MATCHES}'
          value: 'CHANGE_IF_NEEDED'
          description: 'Scopes not monitored (regex on scope ID).'
        - macro: '{$INT.ROLE.DHCP.SERVICES}'
          value: 'DHCPServer'
        - macro: '{$INT.ROLE.DHCP.WARN}'
          value: '85'
      valuemaps:
        - uuid: adcd133956224c4790f2dc58ad785fd0
          name: 'INT ROLE DHCP service state'
          mappings:
            - value: '0'
              newvalue: Running
            - value: '1'
              newvalue: Paused
            - value: '2'
              newvalue: 'Start pending'
