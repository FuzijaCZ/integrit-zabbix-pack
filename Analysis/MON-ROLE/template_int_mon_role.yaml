              name: 'INT: DNS server {HOST.NAME} reports AD zone errors'
              opdata: '{ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: 'AD-integrated zones cannot load or replicate (AD / DC problem, see MON-AD). Resolves 1 h after the last event.'
              tags:
