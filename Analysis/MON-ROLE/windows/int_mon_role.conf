# Integrit MON-ROLE UserParameters for Zabbix agent 2 (Windows role servers).
# Copy to: C:\Program Files\Zabbix Agent 2\zabbix_agent2.d\int_mon_role.conf
# Script:  C:\Program Files\Zabbix Agent 2\scripts\int_mon_role.ps1
# Timeouts come from the item settings in the INT MON-ROLE templates. Parameters are plain numbers / DNS names.

UserParameter=int.role.dhcp,powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\Program Files\Zabbix Agent 2\scripts\int_mon_role.ps1" -Mode dhcp
UserParameter=int.role.shares,powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\Program Files\Zabbix Agent 2\scripts\int_mon_role.ps1" -Mode shares
UserParameter=int.role.vss,powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\Program Files\Zabbix Agent 2\scripts\int_mon_role.ps1" -Mode vss
UserParameter=int.role.fsrm,powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\Program Files\Zabbix Agent 2\scripts\int_mon_role.ps1" -Mode fsrm
UserParameter=int.role.dfsr,powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\Program Files\Zabbix Agent 2\scripts\int_mon_role.ps1" -Mode dfsr
UserParameter=int.role.print[*],powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\Program Files\Zabbix Agent 2\scripts\int_mon_role.ps1" -Mode print -Minutes $1
UserParameter=int.role.rds,powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\Program Files\Zabbix Agent 2\scripts\int_mon_role.ps1" -Mode rds
UserParameter=int.role.dns[*],powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\Program Files\Zabbix Agent 2\scripts\int_mon_role.ps1" -Mode dns -Internal "$1" -External "$2"
