      tags:
        - tag: service
          value: MON-IDSEC
        - tag: version
          value: '1.0'
      macros:
        - macro: '{$INT.IDSEC.BREAKGLASS}'
          description: 'Comma list of break-glass account UPNs, e.g. bg01@acme.onmicrosoft.com,bg02@acme.onmicrosoft.com.'
        - macro: '{$INT.IDSEC.CONSENT.HIGH}'
          value: '(Mail\.|Files\.|Sites\.|Directory\.ReadWrite|User\.ReadWrite\.All|full_access_as_app|RoleManagement|Application\.ReadWrite)'
          description: 'Regex of permissions that make a consent high-privilege.'
        - macro: '{$INT.IDSEC.COUNTRIES}'
          value: 'CZ,SK'
          description: 'Allowed sign-in countries (ISO 3166 alpha-2, comma list).'
        - macro: '{$INT.IDSEC.COUNTRY.IGNORE}'
          description: 'Regex of UPNs excluded from the country check (frequent travellers). Empty = none.'
        - macro: '{$INT.IDSEC.FWD.ALLOW}'
          description: 'Comma list of external domains with agreed forwarding (e.g. the accountant). Empty = none.'
        - macro: '{$INT.IDSEC.FWD.MAXUSERS}'
          value: '500'
        - macro: '{$INT.IDSEC.LAG}'
          value: '15'
          description: 'Minutes the checked window lags behind now (Entra log latency).'
        - macro: '{$INT.IDSEC.LEGACY}'
          value: '^(Authenticated SMTP|AutoDiscover|Exchange ActiveSync|Exchange Web Services|IMAP4|MAPI Over HTTP|Offline Address Book|Other clients|Outlook Anywhere.*|POP3|Reporting Web Services|Universal Outlook)$'
          description: 'clientAppUsed values counted as legacy authentication.'
        - macro: '{$INT.IDSEC.NODATA}'
          value: 30m
        - macro: '{$INT.IDSEC.P1}'
          value: '1'
          description: '1 = tenant has Entra ID P1 (Business Premium, E3): sign-in checks run.'
        - macro: '{$INT.IDSEC.P2}'
          value: '0'
          description: '1 = tenant has Entra ID P2 (E5, add-on): risk checks run.'
        - macro: '{$INT.IDSEC.ROLE.HIGH}'
          value: '^(Global Administrator|Privileged Role Administrator|Privileged Authentication Administrator|Security Administrator|Exchange Administrator|SharePoint Administrator|User Administrator|Application Administrator|Cloud Application Administrator|Conditional Access Administrator)$'
          description: 'Roles alerted as HIGH; other roles AVERAGE.'
        - macro: '{$MS365.APP.ID}'
          description: 'Same value as for MON-M365 (set on the tenant host).'
        - macro: '{$MS365.HTTP.PROXY}'
        - macro: '{$MS365.PASSWORD}'
          type: SECRET_TEXT
          description: 'Same value as for MON-M365 (set on the tenant host).'
        - macro: '{$MS365.TENANT.ID}'
          description: 'Same value as for MON-M365 (set on the tenant host).'
