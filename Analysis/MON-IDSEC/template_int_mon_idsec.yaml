zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 0e91516969de4dc0a26520dec346be24
      name: Templates/Integrit/MON-IDSEC
  templates:
    - uuid: e3592ea87f524254ba81168a2ada21e1
      template: 'INT MON-IDSEC Entra ID'
      name: 'INT MON-IDSEC Entra ID'
      description: |
        Integrit MON-IDSEC: Entra ID identity security events (extension of MON-M365), external proxy, Microsoft Graph.
        Break-glass sign-ins, risky users / detections (P2), privileged role assignments, Conditional Access changes, security
        defaults off, high-privilege app consents, new app credentials, sign-ins from outside the country allow-list and legacy
        authentication (P1), external inbox forwarding rules. Linked on the MON-M365 tenant host, same {$MS365.*} credentials.
        Not a SOC: alerts and reports, no investigation. Event problems stay open until closed manually.
      vendor:
        name: 'integrit s.r.o.'
        version: 7.0-1
      groups:
        - name: Templates/Integrit/MON-IDSEC
      items:
        - uuid: 5d9d273585ff4123b2dea7c5568ddff0
          name: 'Identity security raw'
          type: SCRIPT
          key: int.idsec.get
          delay: 5m
          history: '0'
          value_type: TEXT
          trends: '0'
          description: 'Graph check every 5 min of a fixed 5-minute window delayed by {$INT.IDSEC.LAG} min.'
          params: |
            var p = JSON.parse(value);
            var G = 'https://graph.microsoft.com/v1.0';
            var out = {error: '', optional_errors: ''};
            var token;

            function request(method, url, body) {
                var req = new HttpRequest();
                if (p.http_proxy && p.http_proxy.indexOf('{$') !== 0) {
                    req.setProxy(p.http_proxy);
                }
                req.addHeader(token ? 'Authorization: Bearer ' + token : 'Content-Type: application/x-www-form-urlencoded');
                if (token) {
                    req.addHeader('ConsistencyLevel: eventual');
                }
                var resp = method === 'POST' ? req.post(url, body) : req.get(url);
                var st = req.getStatus();
                if (st < 200 || st >= 300) {
                    throw 'HTTP ' + st + ' ' + url.replace(/^https:\/\/[^/]+/, '').replace(/\?.*$/, '') + ': ' + String(resp).substring(0, 120);
                }
                return resp ? JSON.parse(resp) : {};
            }

            // All pages of a collection, capped (a 5-minute window never needs more in SMB tenants).
            function list(url, maxPages) {
                var res = [], n = 0;
                while (url && n < (maxPages || 5)) {
                    var r = request('GET', url);
                    res = res.concat(r.value || []);
                    url = r['@odata.nextLink'];
                    n++;
                }
                return res;
            }

            // Optional checks (licence / permission dependent) must not break the required ones.
            function optional(name, fn) {
                try {
                    fn();
                }
                catch (e) {
                    out.optional_errors += (out.optional_errors ? '; ' : '') + name + ': ' + String(e).substring(0, 150);
                }
            }

            function iso(t) {
                return new Date(t * 1000).toISOString().replace(/\.\d+Z$/, 'Z');
            }

            function short(arr) {
                var s = arr.slice(0, 5).join('; ');
                return (arr.length > 5 ? arr.length + ' events: ' : '') + s.substring(0, 240);
            }

            function prop(t, name) {
                var v = '';
                (t.modifiedProperties || []).forEach(function (m) {
                    if (m.displayName === name) {
                        v = String(m.newValue || '').replace(/^"|"$/g, '');
                    }
                });
                return v;
            }

            function actor(a) {
                var i = a.initiatedBy || {};
                return (i.user && i.user.userPrincipalName) || (i.app && i.app.displayName) || '?';
            }

            try {
                ['tenant_id', 'app_id', 'password'].forEach(function (f) {
                    if (!p[f] || p[f].indexOf('{$') === 0) {
                        throw 'Parameter ' + f + ' is not set (host macro).';
                    }
                });
                var t = request('POST', 'https://login.microsoftonline.com/' + encodeURIComponent(p.tenant_id) + '/oauth2/v2.0/token',
                    'grant_type=client_credentials&scope=' + encodeURIComponent('https://graph.microsoft.com/.default') +
                    '&client_id=' + encodeURIComponent(p.app_id) + '&client_secret=' + encodeURIComponent(p.password));
                token = t.access_token;

                // Fixed 5-minute buckets, delayed by the log latency: every event falls in exactly one run (no de-duplication needed).
                var step = 300, lag = parseInt(p.lag_min, 10) * 60;
                var till = Math.floor(Date.now() / 1000 / step) * step - lag, from = till - step;
                var win = 'ge ' + iso(from) + ' and activityDateTime lt ' + iso(till);

                // Directory audit (any licence): role assignments, CA policies, consents, service principal credentials.
                var audits = list(G + '/auditLogs/directoryAudits?$filter=' + encodeURIComponent('activityDateTime ' + win), 10);
                var ga = [], role = [], ca = [], consent = [], cred = [];
                var gaRe = new RegExp(p.role_high_regex, 'i'), privRe = new RegExp(p.consent_high_regex, 'i');
                audits.forEach(function (a) {
                    var n = a.activityDisplayName, target = (a.targetResources || [])[0] || {};
                    var who = actor(a), what = target.userPrincipalName || target.displayName || '';
                    if (/^Add (eligible )?member to role( in PIM completed \((permanent|timebound)\))?$/.test(n)) {
                        var r = prop(target, 'Role.DisplayName') || ((a.targetResources || [])[1] || {}).displayName || '';
                        (gaRe.test(r) ? ga : role).push(r + ' -> ' + what + ' by ' + who);
                    }
                    else if (/conditional access policy$/i.test(n)) {
                        ca.push(n + ': ' + what + ' by ' + who);
                    }
                    else if (n === 'Consent to application') {
                        var perms = JSON.stringify(target.modifiedProperties || []);
                        if (privRe.test(perms)) {
                            consent.push(what + ' by ' + who);
                        }
                    }
                    else if (/^(Add service principal credentials|Update application . Certificates and secrets management)/.test(n)) {
                        cred.push(what + ' by ' + who);
                    }
                });
                out.role_ga = ga.length; out.role_ga_text = short(ga);
                out.role_other = role.length; out.role_other_text = short(role);
                out.ca_changes = ca.length; out.ca_text = short(ca);
                out.consents = consent.length; out.consents_text = short(consent);
                out.sp_creds = cred.length; out.sp_creds_text = short(cred);

                optional('security defaults', function () {
                    out.security_defaults = request('GET', G + '/policies/identitySecurityDefaultsEnforcementPolicy').isEnabled ? 1 : 0;
                });

                if (p.p1 === '1') {
                    optional('sign-ins', function () {
                        var sf = 'createdDateTime ge ' + iso(from) + ' and createdDateTime lt ' + iso(till) + ' and status/errorCode eq 0';
                        var signins = list(G + '/auditLogs/signIns?$top=999&$select=userPrincipalName,ipAddress,location,clientAppUsed,createdDateTime' +
                            '&$filter=' + encodeURIComponent(sf), 10);
                        var bg = (p.breakglass || '').toLowerCase().split(',').filter(function (x) { return x.trim(); });
                        var countries = (p.countries || '').toUpperCase().split(',');
                        var legacyRe = new RegExp(p.legacy_regex, 'i');
                        var b = [], c = [], l = [];
                        signins.forEach(function (s) {
                            var upn = String(s.userPrincipalName || '').toLowerCase(), cc = ((s.location || {}).countryOrRegion || '').toUpperCase();
                            var line = upn + ' from ' + s.ipAddress + (cc ? ' (' + cc + ')' : '');
                            if (bg.indexOf(upn) >= 0) {
                                b.push(line);
                            }
                            if (cc && countries.indexOf(cc) < 0 && (p.country_ignore === '' || !new RegExp(p.country_ignore, 'i').test(upn))) {
                                c.push(line);
                            }
                            if (legacyRe.test(s.clientAppUsed || '')) {
                                l.push(line + ' via ' + s.clientAppUsed);
                            }
                        });
                        out.breakglass = b.length; out.breakglass_text = short(b);
                        out.foreign = c.length; out.foreign_text = short(c);
                        out.legacy = l.length; out.legacy_text = short(l);
                    });
                }

                if (p.p2 === '1') {
                    optional('risk', function () {
                        var ru = list(G + '/identityProtection/riskyUsers?$filter=' + encodeURIComponent("riskState eq 'atRisk' and riskLevel eq 'high'"), 3);
                        out.risky_high = ru.length;
                        out.risky_high_text = short(ru.map(function (u) { return u.userPrincipalName; }));
                        var rd = list(G + '/identityProtection/riskDetections?$filter=' + encodeURIComponent(
                            "riskLevel eq 'high' and detectedDateTime ge " + iso(from) + ' and detectedDateTime lt ' + iso(till)), 3);
                        out.risk_detections = rd.length;
                        out.risk_detections_text = short(rd.map(function (d) { return d.userPrincipalName + ': ' + d.riskEventType + ' from ' + d.ipAddress; }));
                    });
                }
            }
            catch (e) {
                out.error = String(e).substring(0, 500);
            }
            return JSON.stringify(out);
          timeout: 60s
          parameters:
            - name: app_id
              value: '{$MS365.APP.ID}'
            - name: breakglass
              value: '{$INT.IDSEC.BREAKGLASS}'
            - name: consent_high_regex
              value: '{$INT.IDSEC.CONSENT.HIGH}'
            - name: countries
              value: '{$INT.IDSEC.COUNTRIES}'
            - name: country_ignore
              value: '{$INT.IDSEC.COUNTRY.IGNORE}'
            - name: http_proxy
              value: '{$MS365.HTTP.PROXY}'
            - name: lag_min
              value: '{$INT.IDSEC.LAG}'
            - name: legacy_regex
              value: '{$INT.IDSEC.LEGACY}'
            - name: p1
              value: '{$INT.IDSEC.P1}'
            - name: p2
              value: '{$INT.IDSEC.P2}'
            - name: password
              value: '{$MS365.PASSWORD}'
            - name: role_high_regex
              value: '{$INT.IDSEC.ROLE.HIGH}'
            - name: tenant_id
              value: '{$MS365.TENANT.ID}'
          tags:
            - tag: component
              value: raw
        - uuid: a6a7c12c703c48f58505f7392e13f5a6
          name: 'Mail forwarding rules raw'
          type: SCRIPT
          key: int.idsec.fwd.get
          delay: 12h
          history: '0'
          value_type: TEXT
          trends: '0'
          description: 'Inbox rules of all enabled users with a mailbox (MailboxSettings.Read), twice a day.'
          params: |
            var p = JSON.parse(value);
            var G = 'https://graph.microsoft.com/v1.0';
            var out = {error: '', fwd: 0, fwd_text: '', checked: 0};
            var token;

            function request(url, body) {
                var req = new HttpRequest();
                if (p.http_proxy && p.http_proxy.indexOf('{$') !== 0) {
                    req.setProxy(p.http_proxy);
                }
                req.addHeader(token ? 'Authorization: Bearer ' + token : 'Content-Type: application/x-www-form-urlencoded');
                var resp = body ? req.post(url, body) : req.get(url);
                return {status: req.getStatus(), body: resp ? JSON.parse(resp) : {}};
            }

            try {
                ['tenant_id', 'app_id', 'password'].forEach(function (f) {
                    if (!p[f] || p[f].indexOf('{$') === 0) {
                        throw 'Parameter ' + f + ' is not set (host macro).';
                    }
                });
                token = request('https://login.microsoftonline.com/' + encodeURIComponent(p.tenant_id) + '/oauth2/v2.0/token',
                    'grant_type=client_credentials&scope=' + encodeURIComponent('https://graph.microsoft.com/.default') +
                    '&client_id=' + encodeURIComponent(p.app_id) + '&client_secret=' + encodeURIComponent(p.password)).body.access_token;
                if (!token) {
                    throw 'Token request failed.';
                }

                // Internal = any verified domain of the tenant, plus the allow-list macro (partner domains with agreed forwarding).
                var d = request(G + '/domains?$select=id,isVerified');
                if (d.status !== 200) {
                    throw 'GET /domains HTTP ' + d.status;
                }
                var internal = (d.body.value || []).filter(function (x) { return x.isVerified; }).map(function (x) { return x.id.toLowerCase(); })
                    .concat((p.allow || '').toLowerCase().split(',').filter(function (x) { return x.trim(); }));

                var url = G + '/users?$select=id,userPrincipalName,mail&$filter=' + encodeURIComponent('accountEnabled eq true') + '&$top=999';
                var users = [];
                while (url && users.length < parseInt(p.max_users, 10)) {
                    var r = request(url);
                    if (r.status !== 200) {
                        throw 'GET /users HTTP ' + r.status;
                    }
                    users = users.concat((r.body.value || []).filter(function (u) { return u.mail; }));
                    url = r.body['@odata.nextLink'];
                }

                var hits = [];
                users.slice(0, parseInt(p.max_users, 10)).forEach(function (u) {
                    var rr = request(G + '/users/' + u.id + '/mailFolders/inbox/messageRules');
                    if (rr.status === 403) {
                        throw 'MailboxSettings.Read permission missing (HTTP 403).';
                    }
                    if (rr.status !== 200) {
                        return; // no mailbox / mailbox on-prem
                    }
                    out.checked++;
                    (rr.body.value || []).forEach(function (rule) {
                        if (!rule.isEnabled || !rule.actions) {
                            return;
                        }
                        var a = rule.actions;
                        [].concat(a.forwardTo || [], a.forwardAsAttachmentTo || [], a.redirectTo || []).forEach(function (rcp) {
                            var addr = String((rcp.emailAddress || {}).address || '').toLowerCase();
                            var dom = addr.split('@')[1] || '';
                            if (dom && internal.indexOf(dom) < 0) {
                                hits.push(u.userPrincipalName + ' -> ' + addr + ' (' + rule.displayName + ')');
                            }
                        });
                    });
                });
                out.fwd = hits.length;
                out.fwd_text = hits.slice(0, 5).join('; ').substring(0, 240);
            }
            catch (e) {
                out.error = String(e).substring(0, 500);
            }
            return JSON.stringify(out);
          timeout: 60s
          parameters:
            - name: allow
              value: '{$INT.IDSEC.FWD.ALLOW}'
            - name: app_id
              value: '{$MS365.APP.ID}'
            - name: http_proxy
              value: '{$MS365.HTTP.PROXY}'
            - name: max_users
              value: '{$INT.IDSEC.FWD.MAXUSERS}'
            - name: password
              value: '{$MS365.PASSWORD}'
            - name: tenant_id
              value: '{$MS365.TENANT.ID}'
          tags:
            - tag: component
              value: raw
