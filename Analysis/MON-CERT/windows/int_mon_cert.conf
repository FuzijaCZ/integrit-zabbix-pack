# Integrit MON-CERT UserParameters for Zabbix agent 2 (Windows).
# Copy to: C:\Program Files\Zabbix Agent 2\zabbix_agent2.d\int_mon_cert.conf
# Script:  C:\Program Files\Zabbix Agent 2\scripts\int_mon_cert.ps1
# Timeouts come from the item settings in templates "INT MON-CERT Windows store" / "INT MON-CERT AD CS".

UserParameter=int.cert.store,powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\Program Files\Zabbix Agent 2\scripts\int_mon_cert.ps1" -Mode store
UserParameter=int.cert.ca,powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\Program Files\Zabbix Agent 2\scripts\int_mon_cert.ps1" -Mode ca
