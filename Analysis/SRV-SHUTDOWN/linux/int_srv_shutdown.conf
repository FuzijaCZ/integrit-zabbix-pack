# Integrit SRV-SHUTDOWN UserParameter for Zabbix agent / agent 2 on Linux hosts with a NUT client (upsmon).
# Copy to: /etc/zabbix/zabbix_agent2.d/int_srv_shutdown.conf  (agent 1: /etc/zabbix/zabbix_agentd.d/)
# Returns 1 when the UPS answers through NUT (upsc), 0 when not. Parameter = UPS name as in upsmon.conf, e.g. ups@192.168.1.10
# (letters, digits, @ . - only: works without UnsafeUserParameters).

UserParameter=int.shut.nut[*],upsc "$1" ups.status >/dev/null 2>&1 && echo 1 || echo 0
