# Integrit MON-SECEVT UserParameter for Zabbix agent 2 (Linux).
# Copy to: /etc/zabbix/zabbix_agent2.d/int_mon_secevt.conf
# Script:  /usr/local/lib/integrit/zabbix/int-secevt.sh (mode 0755, owner root)
# The zabbix user needs read access to the journal: usermod -aG systemd-journal zabbix (or adm for /var/log/auth.log).
# Parameters come from template macros as plain comma lists (no UnsafeUserParameters needed).

UserParameter=int.secevt.linux[*],/usr/local/lib/integrit/zabbix/int-secevt.sh "$1" "$2" "$3"
