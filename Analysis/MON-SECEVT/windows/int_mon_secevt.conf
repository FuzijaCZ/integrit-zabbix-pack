# Integrit MON-SECEVT UserParameter for Zabbix agent 2 (Windows).
# Copy to: C:\Program Files\Zabbix Agent 2\zabbix_agent2.d\int_mon_secevt.conf
# Script:  C:\Program Files\Zabbix Agent 2\scripts\int_mon_secevt.ps1
# The event log items (eventlog[...]) of template "INT MON-SECEVT Windows" need no UserParameter.

UserParameter=int.secevt.failed[*],powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\Program Files\Zabbix Agent 2\scripts\int_mon_secevt.ps1" -Minutes $1
