          description: '°C within {$INT.ENV.TEMP.RISE.TIME}.'
        - macro: '{$INT.ENV.TEMP.RISE.TIME}'
          value: 15m
        - macro: '{$INT.ENV.TEMP.SENSORS}'
          description: 'label|OID|multiplier;... Empty = none.'
        - macro: '{$INT.ENV.TEMP.WARN}'
          value: '27'
          description: 'ASHRAE A1 recommended inlet maximum.'
        - macro: '{$INT.ENV.TEMP.WARN.TIME}'
          value: 10m
        - macro: '{$INT.ENV.UNIT.DOWN.TIME}'
          value: 5m
