zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 289a597e28be400da3c3039f35facc80
      name: Templates/Integrit/MON-ENV
  templates:
    - uuid: 56acb4a21d064afb96cb3f0987d09a3e
      template: 'INT MON-ENV SNMP sensors'
      name: 'INT MON-ENV SNMP sensors'
      description: |
        Integrit MON-ENV: server room / rack environment from any SNMP sensor unit (HW group, Comet, Papouch, AKCP, ...), site proxy.
        Sensors are listed in host macros (label|OID|multiplier or label|OID|alarm value); no vendor MIB needed.
        Temperature, rise rate, humidity, flood, smoke (informative, not a fire alarm), door, mains power, unit availability.
        Thresholds use macro context per sensor label, e.g. {$INT.ENV.TEMP.WARN:"Room"}=30.
      vendor:
        name: 'integrit s.r.o.'
        version: 7.0-1
      groups:
        - name: Templates/Integrit/MON-ENV
      items:
        - uuid: 71853f9837d0492fb67255387df84dd2
          name: 'Sensor unit: SNMP availability'
          type: INTERNAL
          key: 'zabbix[host,snmp,available]'
          history: 7d
          description: '0 not available, 1 available, 2 unknown.'
          valuemap:
            name: 'INT ENV availability'
          tags:
            - tag: component
              value: unit
          triggers:
            - uuid: 63b34e2834514acf941b3f76a7807d3e
              expression: 'max(/INT MON-ENV SNMP sensors/zabbix[host,snmp,available],{$INT.ENV.UNIT.DOWN.TIME})=0'
              name: 'INT: Sensor unit {HOST.NAME} is not responding to SNMP'
              priority: AVERAGE
              description: 'Unit offline (power, network, PoE) or SNMP community changed. Room conditions are unknown. Depends on the site gateway (host-level dependency, MON-NET).'
              tags:
                - tag: scope
                  value: availability
      discovery_rules:
        - uuid: f30e9ff786fa42fa8a10df89af4dc09f
          name: 'Temperature sensors from {$INT.ENV.TEMP.SENSORS}'
          type: SCRIPT
          key: 'int.env.discovery[temp]'
          delay: 1h
          params: |
            var p = JSON.parse(value), names = String(p.fields).split(','), out = [];
            String(p.list).split(';').forEach(function (entry) {
                if (!entry.trim()) {
                    return;
                }
                var f = entry.replace(/\\\|/g, '\u0001').split('|').map(function (x) { return x.replace(/\u0001/g, '|'); }), row = {};
                if (f.length !== names.length) {
                    throw 'Entry "' + entry + '" needs ' + names.length + ' fields separated by |: ' + p.fields;
                }
                names.forEach(function (n, i) { row[n.trim()] = f[i].trim(); });
                out.push(row);
            });
            return JSON.stringify(out);
          parameters:
            - name: fields
              value: '{#LABEL},{#OID},{#MULT}'
            - name: list
              value: '{$INT.ENV.TEMP.SENSORS}'
          enabled_lifetime_type: DISABLE_NEVER
          description: 'Entries label|OID|multiplier separated by ; (e.g. Rack inlet|1.3.6.1.4.1.21796.4.9.3.1.5.1|0.1).'
          item_prototypes:
            - uuid: d4990d389cb1456383aeacae96da92b9
              name: 'Temperature {#LABEL}'
              type: SNMP_AGENT
              snmp_oid: '{#OID}'
              key: 'int.env.temp["{#LABEL}"]'
              delay: '{$INT.ENV.INTERVAL}'
              value_type: FLOAT
              units: '°C'
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '{#MULT}'
              tags:
                - tag: component
                  value: temperature
                - tag: sensor
                  value: '{#LABEL}'
          trigger_prototypes:
            - uuid: 5f6e506d098e4b3dae0570d88b96a81b
              expression: 'min(/INT MON-ENV SNMP sensors/int.env.temp["{#LABEL}"],#2)>{$INT.ENV.TEMP.EXTREME:"{#LABEL}"}'
              name: 'INT: Extreme temperature at {#LABEL}'
              opdata: '{ITEM.LASTVALUE1}'
              priority: DISASTER
              description: 'Hardware damage within minutes. Shut down non-critical servers (SRV-SHUTDOWN plan) and get the room cooled.'
              tags:
                - tag: scope
                  value: environment
            - uuid: 910532d96769479e8fb58ef3be04b2cb
              expression: 'min(/INT MON-ENV SNMP sensors/int.env.temp["{#LABEL}"],{$INT.ENV.TEMP.CRIT.TIME:"{#LABEL}"})>{$INT.ENV.TEMP.CRIT:"{#LABEL}"}'
              name: 'INT: Critical temperature at {#LABEL}'
              opdata: '{ITEM.LASTVALUE1}'
              priority: HIGH
              description: 'Cooling has failed or is overloaded. Call the HVAC service contact.'
              dependencies:
                - name: 'INT: Extreme temperature at {#LABEL}'
                  expression: 'min(/INT MON-ENV SNMP sensors/int.env.temp["{#LABEL}"],#2)>{$INT.ENV.TEMP.EXTREME:"{#LABEL}"}'
              tags:
                - tag: scope
                  value: environment
            - uuid: 92a0efb10def41d4b26e940545d10152
              expression: 'min(/INT MON-ENV SNMP sensors/int.env.temp["{#LABEL}"],{$INT.ENV.TEMP.WARN.TIME:"{#LABEL}"})>{$INT.ENV.TEMP.WARN:"{#LABEL}"}'
              name: 'INT: High temperature at {#LABEL}'
              opdata: '{ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: 'Above the ASHRAE A1 recommended inlet range.'
              dependencies:
                - name: 'INT: Critical temperature at {#LABEL}'
                  expression: 'min(/INT MON-ENV SNMP sensors/int.env.temp["{#LABEL}"],{$INT.ENV.TEMP.CRIT.TIME:"{#LABEL}"})>{$INT.ENV.TEMP.CRIT:"{#LABEL}"}'
              tags:
                - tag: scope
                  value: environment
            - uuid: 7ad4d498938045c0980918e0784b257e
              expression: 'last(/INT MON-ENV SNMP sensors/int.env.temp["{#LABEL}"])-min(/INT MON-ENV SNMP sensors/int.env.temp["{#LABEL}"],{$INT.ENV.TEMP.RISE.TIME:"{#LABEL}"})>{$INT.ENV.TEMP.RISE:"{#LABEL}"}'
              name: 'INT: Temperature at {#LABEL} rising fast (cooling failure?)'
              opdata: '{ITEM.LASTVALUE1}'
              priority: HIGH
              description: 'Rise of more than {$INT.ENV.TEMP.RISE} °C within {$INT.ENV.TEMP.RISE.TIME}. Expected during a power outage when HVAC is not on UPS, still act.'
              dependencies:
                - name: 'INT: Critical temperature at {#LABEL}'
                  expression: 'min(/INT MON-ENV SNMP sensors/int.env.temp["{#LABEL}"],{$INT.ENV.TEMP.CRIT.TIME:"{#LABEL}"})>{$INT.ENV.TEMP.CRIT:"{#LABEL}"}'
              tags:
                - tag: scope
                  value: environment
            - uuid: 0d59842b35ff4b0e8664d7c50e17b7d4
              expression: 'nodata(/INT MON-ENV SNMP sensors/int.env.temp["{#LABEL}"],{$INT.ENV.NODATA})=1'
              name: 'INT: Sensor {#LABEL} sends no data'
              priority: AVERAGE
              description: 'Sensor disconnected, broken or the OID is wrong.'
              dependencies:
                - name: 'INT: Sensor unit {HOST.NAME} is not responding to SNMP'
                  expression: 'max(/INT MON-ENV SNMP sensors/zabbix[host,snmp,available],{$INT.ENV.UNIT.DOWN.TIME})=0'
              tags:
                - tag: scope
                  value: availability
        - uuid: d2a3ddd5937a4c749ffb09f1c93786e6
          name: 'Humidity sensors from {$INT.ENV.HUM.SENSORS}'
          type: SCRIPT
          key: 'int.env.discovery[hum]'
