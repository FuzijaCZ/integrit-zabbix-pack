              expression: 'min(/INT MON-ENV SNMP sensors/int.env.door["{#LABEL}"],{$INT.ENV.DOOR.TIME})=1 and (dayofweek()>5 or time()<{$INT.ENV.WORK.START} or time()>={$INT.ENV.WORK.END})'
              name: 'INT: Door {#LABEL} open outside working hours'
              priority: WARNING
              description: 'Open longer than {$INT.ENV.DOOR.TIME} outside Mon-Fri {$INT.ENV.WORK.START}-{$INT.ENV.WORK.END}.'
