        - macro: '{$INT.ENV.HUM.MAX}'
          value: '70'
        - macro: '{$INT.ENV.HUM.MIN}'
          value: '20'
        - macro: '{$INT.ENV.HUM.SENSORS}'
          description: 'label|OID|multiplier;... Empty = none.'
        - macro: '{$INT.ENV.HUM.TIME}'
          value: 30m
        - macro: '{$INT.ENV.INTERVAL}'
          value: 1m
        - macro: '{$INT.ENV.NODATA}'
          value: 15m
        - macro: '{$INT.ENV.POWER.SENSORS}'
          description: 'label|OID|alarm-value-regex;... (mains lost = alarm). Empty = none.'
        - macro: '{$INT.ENV.SMOKE.SENSORS}'
          description: 'label|OID|alarm-value-regex;... Empty = none.'
        - macro: '{$INT.ENV.TEMP.CRIT}'
          value: '32'
        - macro: '{$INT.ENV.TEMP.CRIT.TIME}'
          value: 5m
        - macro: '{$INT.ENV.TEMP.EXTREME}'
