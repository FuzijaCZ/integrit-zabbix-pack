# Integrit MON-SRV UserParameters for Zabbix agent 2 (Windows).
# Copy to: C:\Program Files\Zabbix Agent 2\zabbix_agent2.d\int_mon_srv.conf
# Script:  C:\Program Files\Zabbix Agent 2\scripts\int_mon_srv.ps1
# Timeouts come from the item settings in template "INT MON-SRV Windows".

UserParameter=int.win.updates,powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\Program Files\Zabbix Agent 2\scripts\int_mon_srv.ps1" -Mode updates
UserParameter=int.win.tasks,powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\Program Files\Zabbix Agent 2\scripts\int_mon_srv.ps1" -Mode tasks
UserParameter=int.win.time[*],powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\Program Files\Zabbix Agent 2\scripts\int_mon_srv.ps1" -Mode time -Ref "$1"
