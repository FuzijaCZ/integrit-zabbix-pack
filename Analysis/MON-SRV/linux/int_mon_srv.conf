# Integrit MON-SRV UserParameters for Zabbix agent 2 (Linux).
# Copy to: /etc/zabbix/zabbix_agent2.d/int_mon_srv.conf
# Scripts: /usr/local/lib/integrit/zabbix/ (mode 0755, owner root)
# Timeouts come from the item settings in template "INT MON-SRV Linux".

UserParameter=int.linux.updates,/usr/local/lib/integrit/zabbix/int-updates.sh
UserParameter=int.linux.time,/usr/local/lib/integrit/zabbix/int-time.sh
UserParameter=int.linux.cron,/usr/local/lib/integrit/zabbix/int-cron-status.sh
UserParameter=int.linux.kernel.errors,/usr/local/lib/integrit/zabbix/int-kernel-errors.sh
UserParameter=int.linux.systemd.failed,systemctl list-units --state=failed --no-legend --plain | wc -l
