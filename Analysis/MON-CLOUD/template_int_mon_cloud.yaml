        - uuid: 0945baf5fa09452091e85cdb8e7990cf
          name: 'Cost: month to date'
          type: DEPENDENT
          key: int.azure.cost.mtd
          delay: '0'
          value_type: FLOAT
          units: '{$INT.CLOUD.CURRENCY}'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.cost_mtd
              error_handler: DISCARD_VALUE
          master_item:
            key: int.azure.cost.get
          tags:
            - tag: component
              value: cost
          triggers:
            - uuid: f4297f75f30f43d9bfa776866697c3a5
              expression: 'last(/INT MON-CLOUD Azure subscription/int.azure.cost.mtd)>{$INT.CLOUD.BUDGET} and {$INT.CLOUD.BUDGET}>0'
              name: 'INT: Azure cost of {HOST.NAME} is over budget: {ITEM.LASTVALUE1} {$INT.CLOUD.CURRENCY}'
              priority: AVERAGE
              description: 'Actual cost this month exceeds {$INT.CLOUD.BUDGET}. Data lag up to 24 h.'
              tags:
                - tag: scope
                  value: cost
        - uuid: 2de1006f964a49f5a9ebbbd2658e2d40
          name: 'Cost: month forecast'
          type: DEPENDENT
          key: int.azure.cost.forecast
          delay: '0'
          value_type: FLOAT
          units: '{$INT.CLOUD.CURRENCY}'
          description: 'Linear projection of month-to-date cost.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.cost_forecast
              error_handler: DISCARD_VALUE
          master_item:
            key: int.azure.cost.get
          tags:
            - tag: component
              value: cost
          triggers:
            - uuid: 2b05f564361443a1a196e72bb8f95d23
              expression: 'last(/INT MON-CLOUD Azure subscription/int.azure.cost.forecast)>{$INT.CLOUD.BUDGET} and {$INT.CLOUD.BUDGET}>0'
              name: 'INT: Azure cost of {HOST.NAME} is forecast over budget: {ITEM.LASTVALUE1} {$INT.CLOUD.CURRENCY}'
              priority: WARNING
              description: 'At the current daily rate the month ends above {$INT.CLOUD.BUDGET}. Check new resources / scaling.'
              dependencies:
                - name: 'INT: Azure cost of {HOST.NAME} is over budget: {ITEM.LASTVALUE1} {$INT.CLOUD.CURRENCY}'
                  expression: 'last(/INT MON-CLOUD Azure subscription/int.azure.cost.mtd)>{$INT.CLOUD.BUDGET} and {$INT.CLOUD.BUDGET}>0'
              tags:
                - tag: scope
                  value: cost
        - uuid: 7ac35bc7b2a94df9aa2dec18bb999cb6
          name: 'Cost: yesterday'
          type: DEPENDENT
          key: int.azure.cost.yesterday
          delay: '0'
          value_type: FLOAT
          units: '{$INT.CLOUD.CURRENCY}'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.cost_yesterday
              error_handler: DISCARD_VALUE
          master_item:
            key: int.azure.cost.get
          tags:
            - tag: component
              value: cost
          triggers:
            - uuid: 597e6b1fc8b14455ad0ed0dd4ef48481
              expression: 'last(/INT MON-CLOUD Azure subscription/int.azure.cost.yesterday)>{$INT.CLOUD.ANOMALY.FACTOR}*last(/INT MON-CLOUD Azure subscription/int.azure.cost.avg7) and last(/INT MON-CLOUD Azure subscription/int.azure.cost.yesterday)>{$INT.CLOUD.ANOMALY.MIN}'
              name: 'INT: Azure cost anomaly in {HOST.NAME}: yesterday {ITEM.LASTVALUE1}, 7-day average {ITEM.LASTVALUE2}'
              priority: WARNING
              description: 'Daily cost more than {$INT.CLOUD.ANOMALY.FACTOR}x the 7-day average (runaway resource, attack, misconfigured scaling).'
              tags:
                - tag: scope
                  value: cost
        - uuid: 5722aefc02e84ce697332d6dcf1e81a4
          name: 'Cost: 7-day daily average'
          type: DEPENDENT
          key: int.azure.cost.avg7
          delay: '0'
          value_type: FLOAT
          units: '{$INT.CLOUD.CURRENCY}'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.cost_avg7
              error_handler: DISCARD_VALUE
          master_item:
            key: int.azure.cost.get
          tags:
            - tag: component
              value: cost
        - uuid: c35cc1bf18f045fc9f7cb915cd346771
          name: 'Cost: errors'
          type: DEPENDENT
          key: int.azure.cost.error
          delay: '0'
          value_type: TEXT
          trends: '0'
          description: 'Usually the Cost Management Reader role is missing.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.optional_errors
              error_handler: DISCARD_VALUE
          master_item:
            key: int.azure.cost.get
          tags:
            - tag: component
              value: monitoring
          triggers:
            - uuid: de6b6815bc144c7ba6abc6f60b82368c
              expression: 'length(last(/INT MON-CLOUD Azure subscription/int.azure.cost.error))>0'
              name: 'INT: Azure cost data not available for {HOST.NAME}'
              opdata: '{ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'Cost Management Reader role missing or the subscription type does not expose costs (some CSP offers). Text in item "Cost: errors".'
              tags:
                - tag: scope
                  value: monitoring
      tags:
        - tag: service
          value: MON-CLOUD
        - tag: version
          value: '1.0'
      macros:
        - macro: '{$AZURE.APP.ID}'
          description: 'Application ID of the Integrit Azure monitoring service principal (global macro with Lighthouse).'
        - macro: '{$AZURE.PASSWORD}'
          type: SECRET_TEXT
          description: 'Client secret of that service principal (global macro).'
        - macro: '{$AZURE.PROXY}'
        - macro: '{$AZURE.SUBSCRIPTION.ID}'
          description: 'Customer subscription ID (host macro).'
        - macro: '{$AZURE.TENANT.ID}'
          description: 'With Lighthouse: the INTEGRIT tenant ID (global macro). Without: the customer tenant ID.'
        - macro: '{$AZURE.RESOURCE.GROUP.MATCHES}'
          value: '.*'
          description: 'Resource groups in scope (regex).'
        - macro: '{$AZURE.RESOURCE.GROUP.NOT.MATCHES}'
          value: '(?i)^(dev|test|lab)-'
          description: 'Resource groups out of scope (dev / test).'
        - macro: '{$INT.CLOUD.ANOMALY.FACTOR}'
          value: '2'
        - macro: '{$INT.CLOUD.ANOMALY.MIN}'
          value: '10'
          description: 'Ignore anomalies below this daily amount (currency of the subscription).'
        - macro: '{$INT.CLOUD.BUDGET}'
          value: '0'
          description: 'Monthly budget in the subscription currency. 0 = no budget triggers.'
        - macro: '{$INT.CLOUD.CURRENCY}'
          value: EUR
        - macro: '{$INT.CLOUD.IGNORE.POWER.TAG}'
          value: zabbix-ignore-power
          description: 'Azure tag name marking VMs that may be stopped (schedules, dev).'
        - macro: '{$INT.CLOUD.NODATA}'
          value: 1h
    - uuid: 4697ee42cc3e4a289777c0b15ce74238
      template: 'INT MON-CLOUD Azure VM'
      name: 'INT MON-CLOUD Azure VM'
      description: |
        Integrit MON-CLOUD for one important Azure VM (host per VM, {$AZURE.RESOURCE.ID} = VM resource ID). Official 'Azure
        Virtual Machine by HTTP': availability (HIGH), CPU, disk, network. OS inside the VM: MON-SRV agent.
      vendor:
        name: 'integrit s.r.o.'
        version: 7.0-1
      templates:
        - name: 'Azure Virtual Machine by HTTP'
      groups:
        - name: Templates/Integrit/MON-CLOUD
      tags:
        - tag: service
          value: MON-CLOUD
        - tag: version
          value: '1.0'
      macros:
        - macro: '{$AZURE.VM.CPU.UTIL.CRIT}'
          value: '95'
          description: 'Official default 90; draft MON-SRV CPU convention.'
