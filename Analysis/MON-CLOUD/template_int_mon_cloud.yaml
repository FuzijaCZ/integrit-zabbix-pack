            - uuid: 7ce60b735cc14e76844932e8e8452517
              expression: 'nodata(/INT MON-CLOUD Azure subscription/int.azure.error,{$INT.CLOUD.NODATA})=1'
              name: 'INT: Azure checks return no data for {HOST.NAME}'
              priority: AVERAGE
              description: 'Script item times out or the external proxy is down.'
