          master_item:
            key: int.azure.health.get
          tags:
            - tag: component
              value: azure
        - uuid: 76b0ac517a75437e8030b8d8b1cb5fec
          name: 'Azure: VMs not running'
          type: DEPENDENT
          key: int.azure.vm.off
          delay: '0'
          description: 'Stopped / deallocated VMs without tag {$INT.CLOUD.IGNORE.POWER.TAG}.'
          preprocessing:
