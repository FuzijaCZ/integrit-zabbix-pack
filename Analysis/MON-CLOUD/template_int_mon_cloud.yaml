        - uuid: 320b36e1f7b54511bade67b2fb26a494
          name: 'Azure: active service issues'
          type: DEPENDENT
          key: int.azure.service_issues
          delay: '0'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.service_issues
              error_handler: DISCARD_VALUE
          master_item:
            key: int.azure.health.get
          tags:
            - tag: component
              value: azure
          triggers:
            - uuid: d2de157f519c4ebb8b61e294482bc268
              expression: 'last(/INT MON-CLOUD Azure subscription/int.azure.service_issues)>0 and length(last(/INT MON-CLOUD Azure subscription/int.azure.service_issues.text))>=0'
              name: 'INT: Azure service issue affects subscription {HOST.NAME}'
              opdata: '{ITEM.LASTVALUE2}'
              priority: AVERAGE
              description: 'Microsoft platform incident in regions / services used by this subscription (Service Health). Explains resource problems; no action at the customer.'
              tags:
                - tag: scope
                  value: availability
        - uuid: f4b60b4c9a0e47d7b6fe5d9430f54547
          name: 'Azure: active service issues list'
          type: DEPENDENT
          key: int.azure.service_issues.text
          delay: '0'
          value_type: CHAR
          trends: '0'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.service_issues_text
              error_handler: DISCARD_VALUE
          master_item:
            key: int.azure.health.get
          tags:
            - tag: component
              value: azure
        - uuid: f2c5ae0457cb4bc79eb111b4da059706
          name: 'Azure: resources unavailable or degraded'
          type: DEPENDENT
          key: int.azure.health.bad
          delay: '0'
          description: 'Resource Health, resource groups in scope.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.health_bad
              error_handler: DISCARD_VALUE
          master_item:
            key: int.azure.health.get
          tags:
            - tag: component
              value: azure
          triggers:
            - uuid: bcd2578f8aca4a489a0ca7067803a780
              expression: 'min(/INT MON-CLOUD Azure subscription/int.azure.health.bad,#2)>0 and length(last(/INT MON-CLOUD Azure subscription/int.azure.health.bad.text))>=0'
              name: 'INT: Azure resources unavailable or degraded in {HOST.NAME}'
              opdata: '{ITEM.LASTVALUE2}'
              priority: AVERAGE
              description: 'Resource Health reports Unavailable / Degraded (list in opdata). Per-resource hosts (VM, SQL) alert with their own triggers.'
              dependencies:
                - name: 'INT: Azure service issue affects subscription {HOST.NAME}'
                  expression: 'last(/INT MON-CLOUD Azure subscription/int.azure.service_issues)>0 and length(last(/INT MON-CLOUD Azure subscription/int.azure.service_issues.text))>=0'
              tags:
                - tag: scope
                  value: availability
        - uuid: 1cbf335cde714a46aa3377a0dc6772d5
          name: 'Azure: resources unavailable or degraded list'
          type: DEPENDENT
          key: int.azure.health.bad.text
