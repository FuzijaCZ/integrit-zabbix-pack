            - uuid: 66f7d37436de42f79c8f80eda25b3aee
              expression: 'length(last(/INT MON-CLOUD Azure subscription/int.azure.error,#1))>0 and length(last(/INT MON-CLOUD Azure subscription/int.azure.error,#2))>0'
              name: 'INT: Azure API access fails for {HOST.NAME}'
              opdata: '{ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: 'Lighthouse delegation removed, secret expired or role missing (Integrit internal). Text in item "Azure: API errors".'
              tags:
                - tag: scope
