              opdata: '{ITEM.LASTVALUE2}'
              priority: HIGH
              description: 'A production VM is stopped or deallocated (list in opdata). VMs that are off on purpose (schedules, dev): add the tag {$INT.CLOUD.IGNORE.POWER.TAG} in Azure.'
              dependencies:
                - name: 'INT: Azure service issue affects subscription {HOST.NAME}'
                  expression: 'last(/INT MON-CLOUD Azure subscription/int.azure.service_issues)>0 and length(last(/INT MON-CLOUD Azure subscription/int.azure.service_issues.text))>=0'
              tags:
                - tag: scope
                  value: availability
        - uuid: d5938f9588a849f48ba6e3b84a527e1f
          name: 'Azure: VMs not running list'
          type: DEPENDENT
