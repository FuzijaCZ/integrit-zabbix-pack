zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: a2aa4d921eee4c2083e100b5b5eefdb0
      name: Templates/Integrit/MON-CLOUD
  templates:
    - uuid: 4e6d872aaa6c4f978c7a5edb9f4c13f9
      template: 'INT MON-CLOUD AWS account'
      name: 'INT MON-CLOUD AWS account'
      description: |
        Integrit MON-CLOUD for one AWS account (on request): official 'AWS Cost Explorer by HTTP' with cross-account
        assume-role. Per-resource hosts use the official AWS EC2 / RDS / S3 / ELB / Lambda / Backup Vault templates directly.
      vendor:
        name: 'integrit s.r.o.'
        version: 7.0-1
      templates:
        - name: 'AWS Cost Explorer by HTTP'
      groups:
        - name: Templates/Integrit/MON-CLOUD
      tags:
        - tag: service
          value: MON-CLOUD
        - tag: version
          value: '1.0'
      macros:
        - macro: '{$AWS.AUTH_TYPE}'
          value: 'assume_role'
          description: 'Cross-account read-only role of the customer (draft 5.6.14).'
    - uuid: dceab64a4a494955b6027a33d637727f
      template: 'INT MON-CLOUD Azure backup vault'
      name: 'INT MON-CLOUD Azure backup vault'
      description: |
        Integrit MON-CLOUD for one Recovery Services vault: official 'Azure Backup Jobs by HTTP' (failed job HIGH,
        restore / deletion jobs). Reported in the MON-BKP section for customers with both services.
      vendor:
        name: 'integrit s.r.o.'
        version: 7.0-1
      templates:
        - name: 'Azure Backup Jobs by HTTP'
      groups:
        - name: Templates/Integrit/MON-CLOUD
      tags:
        - tag: service
          value: MON-CLOUD
        - tag: version
          value: '1.0'
    - uuid: 797436b6e2e8472f8da85eac00f891b7
      template: 'INT MON-CLOUD Azure SQL database'
      name: 'INT MON-CLOUD Azure SQL database'
      description: |
        Integrit MON-CLOUD for one Azure SQL database (vCore). Official 'Azure Microsoft SQL Database by HTTP' with storage
        thresholds per draft 85 / 95 % (official severities: WARNING / AVERAGE). DTU or serverless databases: link the matching
        official template on the host instead, with the same macro values.
      vendor:
        name: 'integrit s.r.o.'
        version: 7.0-1
      templates:
        - name: 'Azure Microsoft SQL Database by HTTP'
      groups:
        - name: Templates/Integrit/MON-CLOUD
      tags:
        - tag: service
          value: MON-CLOUD
        - tag: version
          value: '1.0'
      macros:
        - macro: '{$AZURE.DB.STORAGE.PUSED.CRIT}'
          value: '95'
          description: 'Draft 5.6.14: > 95 %.'
        - macro: '{$AZURE.DB.STORAGE.PUSED.WARN}'
          value: '85'
          description: 'Draft 5.6.14: > 85 %.'
    - uuid: 079318fb49d04530bdf731ee05148cfe
      template: 'INT MON-CLOUD Azure subscription'
      name: 'INT MON-CLOUD Azure subscription'
      description: |
        Integrit MON-CLOUD for one Azure subscription (external proxy, Azure Lighthouse service principal of Integrit).
        Links the official 'Azure Cost Management by HTTP' (cost breakdown for the report) and adds: Resource Health of all
        resources in scope, VMs stopped unexpectedly (tag-based exceptions), active Azure service issues, month-to-date cost vs
        budget, forecast and daily anomaly. Per-resource detail: separate hosts with the INT MON-CLOUD Azure VM / SQL / backup
        templates (no auto-created hosts: keeps tenants separated and billing counts predictable).
      vendor:
        name: 'integrit s.r.o.'
        version: 7.0-1
      templates:
        - name: 'Azure Cost Management by HTTP'
      groups:
        - name: Templates/Integrit/MON-CLOUD
      items:
        - uuid: b83eaf2b6da1400fbd7ef681b38179c9
          name: 'Azure health raw'
          type: SCRIPT
          key: int.azure.health.get
          delay: 10m
          history: '0'
          value_type: TEXT
          trends: '0'
          params: |
            var p = JSON.parse(value);
            var ARM = 'https://management.azure.com/subscriptions/' + encodeURIComponent(p.subscription_id);
            var out = {error: '', optional_errors: ''};
            var token;

            function request(url, body, form) {
                var req = new HttpRequest();
                if (p.proxy && p.proxy.indexOf('{$') !== 0) {
                    req.setProxy(p.proxy);
                }
                req.addHeader(form ? 'Content-Type: application/x-www-form-urlencoded' : 'Content-Type: application/json');
                if (token) {
                    req.addHeader('Authorization: Bearer ' + token);
                }
                var resp = body !== undefined ? req.post(url, body) : req.get(url);
                var st = req.getStatus();
                if (st < 200 || st >= 300) {
                    throw 'HTTP ' + st + ' ' + url.replace(/^https:\/\/[^/]+/, '').replace(/\?.*$/, '').replace(/^\/subscriptions\/[^/]+/, '') + ': ' + String(resp).substring(0, 120);
                }
                return JSON.parse(resp);
            }

            function list(url) {
                var res = [], n = 0;
                while (url && n < 20) {
                    var r = request(url);
                    res = res.concat(r.value || []);
                    url = r.nextLink;
                    n++;
                }
                return res;
            }

            function optional(name, fn) {
                try {
                    fn();
                }
                catch (e) {
                    out.optional_errors += (out.optional_errors ? '; ' : '') + name + ': ' + String(e).substring(0, 150);
                }
            }

            function short(arr) {
                return ((arr.length > 6 ? arr.length + ': ' : '') + arr.slice(0, 6).join(', ')).substring(0, 240);
            }

            // /subscriptions/x/resourceGroups/RG/providers/Microsoft.Compute/virtualMachines/NAME[/providers/...] -> {rg, type, name}
            function rid(id) {
                var m = /resourceGroups\/([^/]+)\/providers\/([^/]+\/[^/]+)\/([^/]+)/i.exec(id) || [];
                return {rg: m[1] || '', type: m[2] || '', name: m[3] || id};
            }

            try {
                ['tenant_id', 'app_id', 'password', 'subscription_id'].forEach(function (f) {
                    if (!p[f] || p[f].indexOf('{$') === 0) {
                        throw 'Parameter ' + f + ' is not set (host macro).';
                    }
                });
                token = request('https://login.microsoftonline.com/' + encodeURIComponent(p.tenant_id) + '/oauth2/v2.0/token',
                    'grant_type=client_credentials&scope=' + encodeURIComponent('https://management.azure.com/.default') +
                    '&client_id=' + encodeURIComponent(p.app_id) + '&client_secret=' + encodeURIComponent(p.password), true).access_token;
                var rgRe = new RegExp(p.rg_matches, 'i'), rgNot = new RegExp(p.rg_not_matches, 'i');
                var inScope = function (rg) { return rgRe.test(rg) && !rgNot.test(rg); };

                if (p.mode === 'health') {
                    // Resource Health of every resource in scope (Unavailable / Degraded).
                    var bad = [];
                    list(ARM + '/providers/Microsoft.ResourceHealth/availabilityStatuses?api-version=2022-10-01').forEach(function (s) {
                        var r = rid(s.id), st = (s.properties || {}).availabilityState;
                        if (inScope(r.rg) && (st === 'Unavailable' || st === 'Degraded')) {
                            bad.push(r.name + ' ' + st);
                        }
                    });
                    out.health_bad = bad.length; out.health_bad_text = short(bad);

                    // VM power state: stopped / deallocated VMs not tagged as allowed to be off.
                    var off = [], running = 0;
                    list(ARM + '/providers/Microsoft.Compute/virtualMachines?api-version=2024-03-01&statusOnly=true').forEach(function (vm) {
                        var r = rid(vm.id), tags = vm.tags || {};
                        if (!inScope(r.rg) || tags.hasOwnProperty(p.ignore_tag)) {
                            return;
                        }
                        var ps = '';
                        (((vm.properties || {}).instanceView || {}).statuses || []).forEach(function (x) {
                            if (/^PowerState\//.test(x.code)) {
                                ps = x.code.split('/')[1];
                            }
                        });
                        if (ps === 'running') {
                            running++;
                        }
                        else if (ps) {
                            off.push(vm.name + ' ' + ps);
                        }
                    });
                    out.vm_running = running; out.vm_off = off.length; out.vm_off_text = short(off);

                    // Active Azure service issues affecting the subscription.
                    optional('service health', function () {
                        var ev = list(ARM + '/providers/Microsoft.ResourceHealth/events?api-version=2022-10-01&$filter=' +
                            encodeURIComponent("properties/eventType eq 'ServiceIssue' and properties/status eq 'Active'"));
                        out.service_issues = ev.length;
                        out.service_issues_text = short(ev.map(function (e) { return (e.properties || {}).title; }));
                    });
                }

                // Cost: month to date, linear projection, yesterday vs average of the 7 days before (Cost Management, delayed up to 24 h).
                if (p.mode === 'cost') {
                    optional('cost', function () {
                        var now = new Date(), day = 86400000;
                        var first = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), 1));
                        var from = new Date(Math.min(first.getTime(), now.getTime() - 9 * day));
                        var q = request(ARM + '/providers/Microsoft.CostManagement/query?api-version=2023-11-01', JSON.stringify({
                            type: 'ActualCost', timeframe: 'Custom',
                            timePeriod: {from: from.toISOString().substring(0, 10) + 'T00:00:00Z', to: now.toISOString().substring(0, 10) + 'T23:59:59Z'},
                            dataset: {granularity: 'Daily', aggregation: {totalCost: {name: 'Cost', function: 'Sum'}}}
                        }));
                        var cols = (q.properties.columns || []).map(function (c) { return c.name; });
                        var ci = cols.indexOf('Cost'), di = cols.indexOf('UsageDate'), ui = cols.indexOf('Currency');
                        var byDay = {}, mtd = 0, cur = '';
                        (q.properties.rows || []).forEach(function (r) {
                            var d = String(r[di]);
                            byDay[d] = (byDay[d] || 0) + r[ci];
                            cur = r[ui] || cur;
                            if (d >= first.toISOString().substring(0, 10).replace(/-/g, '')) {
                                mtd += r[ci];
                            }
                        });
                        var key = function (t) { return new Date(t).toISOString().substring(0, 10).replace(/-/g, ''); };
                        var y = byDay[key(now.getTime() - day)] || 0, prev = 0;
                        for (var i = 2; i <= 8; i++) {
                            prev += byDay[key(now.getTime() - i * day)] || 0;
                        }
                        var dim = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth() + 1, 0)).getUTCDate();
                        var elapsed = Math.max(1, now.getUTCDate() - 1);
                        out.cost_mtd = Math.round(mtd * 100) / 100;
                        out.cost_forecast = Math.round(mtd / elapsed * dim * 100) / 100;
                        out.cost_yesterday = Math.round(y * 100) / 100;
                        out.cost_avg7 = Math.round(prev / 7 * 100) / 100;
                        out.currency = cur;
                    });
                }
            }
            catch (e) {
                out.error = String(e).substring(0, 500);
            }
            return JSON.stringify(out);
          timeout: 60s
          parameters:
            - name: app_id
              value: '{$AZURE.APP.ID}'
            - name: ignore_tag
              value: '{$INT.CLOUD.IGNORE.POWER.TAG}'
            - name: mode
              value: 'health'
            - name: password
              value: '{$AZURE.PASSWORD}'
            - name: proxy
              value: '{$AZURE.PROXY}'
            - name: rg_matches
              value: '{$AZURE.RESOURCE.GROUP.MATCHES}'
            - name: rg_not_matches
              value: '{$AZURE.RESOURCE.GROUP.NOT.MATCHES}'
            - name: subscription_id
              value: '{$AZURE.SUBSCRIPTION.ID}'
            - name: tenant_id
              value: '{$AZURE.TENANT.ID}'
          tags:
            - tag: component
              value: raw
        - uuid: 380d208a50b64817b011c22698117848
